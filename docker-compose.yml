version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: therentalcircle-app
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - BETTER_AUTH_URL=http://localhost:3000
    restart: unless-stopped
